    # =========================
    # SERVER
    # =========================
    server.port=8080
    server.address=0.0.0.0

    spring.application.name=backend

    # =========================
    # JWT
    # =========================
    app.jwt.secret=${APP_JWT_SECRET:7d2cc5eb0c213621bd212aea24ca2c51de43e732a683533caa4537ef36ff2554}
    app.jwt.expiration=86400000
    # =========================
    # TOMCAT
    # =========================
    server.tomcat.max-threads=200
    server.tomcat.accept-count=100
    server.tomcat.connection-timeout=5s

    # =========================
    # ERROR
    # =========================
    server.error.include-message=always
    server.error.include-binding-errors=always

    # PostgreSQL Configuration
    spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/messaging}
    spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
    spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}

    #Flyway Configuration
    spring.flyway.enabled=true
    spring.flyway.baseline-on-migrate=true
    spring.flyway.locations=classpath:db/migration
    spring.flyway.out-of-order=true

    # JPA/Hibernate Configuration
    spring.jpa.hibernate.ddl-auto=validate
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

    # MongoDB Configuration
    spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://admin:123456@localhost:27017/messaging?authSource=admin}
    spring.data.mongodb.auto-index-creation=true

    # Redis Configuration
    spring.redis.host=${SPRING_REDIS_HOST:localhost}
    spring.redis.port=${SPRING_REDIS_PORT:6379}
    spring.redis.password=${SPRING_REDIS_PASSWORD:123456}
    spring.redis.timeout=60000ms
    spring.redis.jedis.pool.max-active=8
    spring.redis.jedis.pool.max-idle=8
    spring.redis.jedis.pool.min-idle=0